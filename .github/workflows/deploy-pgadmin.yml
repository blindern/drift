name: Deploy pgadmin
on:
  push:
    branches: [main]
    paths:
      - ansible/roles/service-pgadmin/**
      - .github/workflows/deploy-pgadmin.yml
  workflow_dispatch:
jobs:
  deploy:
    if: vars.DEPLOY_DISABLED != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-pgadmin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-ansible
        with:
          ssh-private-key: ${{ secrets.FBS_SSH_KEY }}
          git-crypt-key: ${{ secrets.GIT_CRYPT_KEY }}
      - run: ansible-playbook site.yml -l fcos-3 -t service-pgadmin
        working-directory: ansible
