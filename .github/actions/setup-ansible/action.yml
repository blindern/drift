name: Setup Ansible
description: Unlock secrets, configure SSH, and install Ansible
inputs:
  ssh-private-key:
    description: 'SSH private key'
    required: true
  git-crypt-key:
    description: 'Git crypt key'
    required: true
runs:
  using: composite
  steps:
    - name: Unlock secrets
      uses: ./.github/actions/setup-git-crypt
      env:
        GIT_CRYPT_KEY: ${{ inputs.git-crypt-key }}
    - uses: ./.github/actions/setup-ssh
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}
    - run: |
        python3 -m venv "$RUNNER_TEMP/ansible"
        "$RUNNER_TEMP/ansible/bin/pip" install -q -r ansible/requirements.txt
        echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
      shell: bash
