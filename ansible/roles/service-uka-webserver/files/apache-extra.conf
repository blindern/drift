# Set HTTPS environment if https through proxy.
# Only trust X-Forwarded-Proto from the front proxy: uka-webserver shares
# the fbs0 network, so a request straight from another container must not be
# able to fake HTTPS. CONN_REMOTE_ADDR is the real TCP peer (mod_remoteip
# rewrites REMOTE_ADDR to the client, but leaves the connection peer).
<If "%{CONN_REMOTE_ADDR} == '172.25.16.14' && %{HTTP:X-Forwarded-Proto} == 'https'">
  SetEnv HTTPS on
</If>

# Set correct remote ip if through proxy
# Uses remoteip module
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.25.16.14
