- name: Create a /var/ansible/snipeit directory if not exisiting
  ansible.builtin.file:
    path: /var/ansible/snipeit
    state: directory
    owner: root
    group: root
    mode: 0700

- name: Copy env file
  ansible.builtin.copy:
    dest: /var/ansible/snipeit/.env
    src: snipe-it-env
    owner: root
    group: root
    mode: 0644

- name: download and start snipeit
  community.docker.docker_container:
    name: snipeit
    state: started
    image: "{{ snipeit_image }}"
    pull: true
    env_file: /var/ansible/snipeit/.env
    volumes:
      - /var/mnt/data/snipe-vol:/var/lib/snipeit:Z
    networks:
      - name: fbs0
        ipv4_address: "{{ snipeit_ipv4_address }}"
    networks_cli_compatible: yes
    restart_policy: unless-stopped
  when: not ansible_check_mode
    
- name: Change permissions of snipeit containers storage directory
  community.docker.docker_container_exec:
    container: snipeit
    argv:
      - /bin/bash
      - "-c"
      - "chown -R docker:root storage"
    chdir: /var/www/html
  when: not ansible_check_mode

- name: Install ldap-sync script
  copy:
    src: snipeit-ldap-sync.sh
    dest: /usr/local/bin/snipeit-ldap-sync.sh
    owner: root
    group: root
    mode: "0755"

- name: Install ldap-sync service
  copy:
    content: |
      [Unit]
      Description=Snipe-IT LDAP sync
      Requires=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/snipeit-ldap-sync.sh
    dest: /etc/systemd/system/snipeit-ldap-sync.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd

- name: Install ldap-sync timer
  copy:
    content: |
      [Unit]
      Description=Run Snipe-IT LDAP sync daily

      [Timer]
      OnCalendar=*-*-* 04:00:00
      RandomizedDelaySec=30m
      Persistent=true

      [Install]
      WantedBy=timers.target
    dest: /etc/systemd/system/snipeit-ldap-sync.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd

- meta: flush_handlers

- name: Activate ldap-sync timer
  systemd:
    name: snipeit-ldap-sync.timer
    state: started
    enabled: yes
